services:
  outbox-pg:
    image: postgres:18
    container_name: outbox-pg
    restart: unless-stopped
    pull_policy: if_not_present
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5766:5432'
    volumes:
      - outbox-pg_data:/var/lib/postgresql
    networks:
      - outbox-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  outbox-nats:
    image: nats:latest
    container_name: outbox-nats
    restart: unless-stopped
    ports:
      - '4222:4222'
      - '6222:6222'
      - '8222:8222'
    networks:
      - outbox-network

  outbox-redis:
    image: redis:alpine
    container_name: outbox-redis
    restart: unless-stopped
    pull_policy: if_not_present
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '6766:6379'
    volumes:
      - outbox-redis_data:/data
    networks:
      - outbox-network
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 2s
      timeout: 2s
      retries: 2

  booking-api:
    image: outbox-booking:latest
    container_name: booking-api
    restart: unless-stopped
    pull_policy: if_not_present
    depends_on:
      outbox-pg:
        condition: service_healthy
    networks:
      - outbox-network
    environment:
      POSTGRES_HOST: outbox-pg
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL}
      APP_PORT: ${PORT}
    ports:
      - '${PORT}:${PORT}'

  booking-worker:
    image: outbox-worker:latest
    container_name: booking-worker
    restart: unless-stopped
    pull_policy: if_not_present
    depends_on:
      outbox-pg:
        condition: service_healthy
    networks:
      - outbox-network
    environment:
      POSTGRES_HOST: outbox-pg
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL}
      TOPIC_IN: ${TOPIC_IN}
      TOPIC_OUT: ${TOPIC_OUT}
      NATS_DSN: ${NATS_DSN}

  booking-alert:
    image: outbox-alert:latest
    container_name: booking-alert
    restart: unless-stopped
    pull_policy: if_not_present
    depends_on:
      outbox-pg:
        condition: service_healthy
    networks:
      - outbox-network
    environment:
      POSTGRES_HOST: outbox-pg
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL}
      APP_PORT: 8080
      TOPIC_IN: ${TOPIC_IN}
      TOPIC_OUT: ${TOPIC_OUT}
      NATS_DSN: ${NATS_DSN}
      REDIS_HOST: outbox-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '${PORT_ALERT:-5566}:8080'

volumes:
  outbox-pg_data:
  outbox-redis_data:

networks:
  outbox-network:
    driver: bridge
